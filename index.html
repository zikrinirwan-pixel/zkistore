<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman Perang: Cyber Ninja</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      background-color: #0d1117;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      touch-action: none;
    }

    /* Info Bar Atas (HP, Mana, Skor) */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #161b22;
      border-bottom: 2px solid #30363d;
      z-index: 10;
    }
    .bars { width: 45%; }
    .bar-bg {
      width: 100%;
      height: 14px;
      background: #333;
      border-radius: 7px;
      overflow: hidden;
      margin-bottom: 5px;
      border: 1px solid #555;
    }
    #hp-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff2a2a, #ff7700); transition: width 0.1s; }
    #mp-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #0088ff, #00ffff); transition: width 0.1s; }
    
    .stats { text-align: right; font-weight: bold; font-size: 14px; }
    .wave-badge { color: #ffcc00; font-size: 16px; }

    /* Area Layar Game */
    #game-container {
      position: relative;
      flex: 1;
      width: 100%;
      background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Layar Game Over / Mulai */
    #overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }
    #overlay h1 { font-size: 32px; color: #00ffff; text-shadow: 0 0 10px #0088ff; margin-bottom: 10px; }
    #overlay p { font-size: 15px; color: #ccc; margin-bottom: 20px; }
    .start-btn {
      background: #ff3300;
      color: white;
      border: 2px solid white;
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 15px #ff3300;
    }

    /* Kontrol Tombol HP Bawah */
    #controls {
      height: 130px;
      background: #161b22;
      border-top: 2px solid #30363d;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      z-index: 10;
    }
    .d-pad, .action-pad { display: flex; gap: 12px; align-items: center; }
    
    .ctrl-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: #21262d;
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      active: transform: scale(0.9);
    }
    .ctrl-btn:active { background: #3b434d; transform: scale(0.92); }
    
    .btn-atk { background: #d92626; border-color: #ff7777; width: 70px; height: 70px; font-size: 15px; }
    .btn-skill { background: #0066cc; border-color: #66ccff; width: 62px; height: 62px; font-size: 13px; opacity: 0.4; }
    .btn-jump { background: #2ea043; border-color: #7ee787; font-size: 14px; }
  </style>
</head>
<body>

  <!-- HUD Atas -->
  <div id="hud">
    <div class="bars">
      <div class="bar-bg"><div id="hp-bar"></div></div>
      <div class="bar-bg"><div id="mp-bar"></div></div>
    </div>
    <div class="stats">
      <div class="wave-badge" id="wave-text">WAVE 1</div>
      <div id="score-text">SKOR: 0</div>
    </div>
  </div>

  <!-- Kanvas Game -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="overlay">
      <h1 id="title-msg">STICKMAN PERANG</h1>
      <p id="sub-msg">Kalahkan pasukan Stickman Merah!<br>Kumpulkan energi biru sampai penuh untuk memakai <b>Jurus Petir</b>.</p>
      <button class="start-btn" onclick="startGame()">MULAI PERANG!</button>
    </div>
  </div>

  <!-- Tombol Kontrol Layar Sentuh -->
  <div id="controls">
    <div class="d-pad">
      <div class="ctrl-btn" id="btn-left">◀</div>
      <div class="ctrl-btn" id="btn-right">▶</div>
    </div>
    <div class="action-pad">
      <div class="ctrl-btn btn-jump" id="btn-jump">LOMPAT</div>
      <div class="ctrl-btn btn-skill" id="btn-skill">PETIR⚡</div>
      <div class="ctrl-btn btn-atk" id="btn-atk">TEBAS⚔️</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    let cw, ch, groundY;
    function resizeCanvas() {
      cw = canvas.width = container.clientWidth;
      ch = canvas.height = container.clientHeight;
      groundY = ch - 35;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Efek Suara Sintetis (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'slash') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(500, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.linearRampToValueAtTime(50, now + 0.12);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now); osc.stop(now + 0.12);
      } else if (type === 'thunder') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.45);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now); osc.stop(now + 0.45);
      }
    }

    // Variabel Game
    let gameRunning = false;
    let score = 0;
    let wave = 1;
    let enemiesToSpawn = 0;
    let spawnTimer = 0;
    let lightningTimer = 0;

    const keys = { left: false, right: false };
    let enemies = [];
    let particles = [];

    const player = {
      x: 150, y: 0, vx: 0, vy: 0,
      speed: 5,
      hp: 100, maxHp: 100,
      mp: 0, maxMp: 100,
      dir: 1, // 1: kanan, -1: kiri
      isGrounded: false,
      atkTimer: 0,
      walkCycle: 0
    };

    // Fungsi Menggambar Stickman
    function drawStickman(x, y, scale, color, dir, walk, isAttacking, weaponColor) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.strokeStyle = color;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';

      const legSwing = Math.sin(walk) * 14;

      // Kepala
      ctx.beginPath();
      ctx.arc(0, -52, 10, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      // Ikat Kepala Ninja (Khusus Pemain)
      if (weaponColor) {
        ctx.strokeStyle = '#00ffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-dir * 8, -54);
        ctx.lineTo(-dir * 24, -50 + Math.sin(walk)*4);
        ctx.stroke();
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
      }

      // Badan (Tulang punggung)
      ctx.beginPath();
      ctx.moveTo(0, -42);
      ctx.lineTo(0, -20);
      ctx.stroke();

      // Kaki Kiri & Kanan
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(legSwing, 0);
      ctx.moveTo(0, -20);
      ctx.lineTo(-legSwing, 0);
      ctx.stroke();

      // Tangan & Senjata
      ctx.beginPath();
      ctx.moveTo(0, -36);
      if (isAttacking) {
        ctx.lineTo(dir * 22, -38);
        ctx.stroke();

        // Gambar Tebasan Pedang Cahaya
        ctx.strokeStyle = weaponColor || '#ff3333';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(dir * 18, -38);
        ctx.lineTo(dir * 52, -45);
        ctx.stroke();

        // Efek Lengkungan Pedang
        ctx.beginPath();
        ctx.arc(0, -35, 48, dir === 1 ? -0.6 : Math.PI - 0.5, dir === 1 ? 0.5 : Math.PI + 0.6);
        ctx.strokeStyle = 'rgba(0, 255, 255, 0.5)';
        ctx.lineWidth = 8;
        ctx.stroke();
      } else {
        ctx.lineTo(dir * 12, -26 + legSwing * 0.3);
        ctx.stroke();
        if (weaponColor) {
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(dir * 12, -26);
          ctx.lineTo(-dir * 10, -45);
          ctx.stroke();
        }
      }

      ctx.restore();
    }

    function createParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.8) * 8,
          size: Math.random() * 4 + 2,
          color: color,
          life: 25
        });
      }
    }

    function spawnWave() {
      enemiesToSpawn = 4 + wave * 3;
      document.getElementById('wave-text').innerText = `WAVE ${wave}`;
    }

    function spawnEnemy() {
      const isBoss = (enemiesToSpawn === 1 && wave % 2 === 0);
      const side = Math.random() < 0.5 ? -30 : cw + 30;
      enemies.push({
        x: side,
        y: groundY,
        hp: isBoss ? 120 + wave * 30 : 25 + wave * 5,
        maxHp: isBoss ? 120 + wave * 30 : 25 + wave * 5,
        speed: isBoss ? 1.4 : 2 + Math.random() * 1.5,
        scale: isBoss ? 1.5 : 1,
        color: isBoss ? '#ffaa00' : '#ff3333',
        atkCooldown: 0,
        isAttacking: false,
        walk: 0,
        isBoss: isBoss
      });
    }

    // Aksi Serang
    function attack() {
      if (!gameRunning || player.atkTimer > 0) return;
      player.atkTimer = 14;
      playSound('slash');

      const reach = 75;
      enemies.forEach(en => {
        const dist = en.x - player.x;
        if ((player.dir === 1 && dist >= -15 && dist <= reach) ||
            (player.dir === -1 && dist <= 15 && dist >= -reach)) {
          if (Math.abs(player.y - en.y) < 60) {
            en.hp -= 20;
            en.x += player.dir * 22; // Efek terpental (Knockback)
            playSound('hit');
            createParticles(en.x, en.y - 30, '#ff3333', 10);
            player.mp = Math.min(player.maxMp, player.mp + 12);
            updateHUD();
          }
        }
      });
    }

    // Aksi Jurus Petir (Ultimate)
    function useSkill() {
      if (!gameRunning || player.mp < 100) return;
      player.mp = 0;
      lightningTimer = 20;
      playSound('thunder');

      enemies.forEach(en => {
        if (Math.abs(en.x - player.x) < 240) {
          en.hp -= 100;
          en.x += (en.x > player.x ? 1 : -1) * 50;
          createParticles(en.x, en.y - 30, '#00ffff', 20);
        }
      });
      updateHUD();
    }

    function jump() {
      if (gameRunning && player.isGrounded) {
        player.vy = -12.5;
        player.isGrounded = false;
      }
    }

    function updateHUD() {
      document.getElementById('hp-bar').style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
      document.getElementById('mp-bar').style.width = (player.mp / player.maxMp) * 100 + '%';
      document.getElementById('score-text').innerText = `SKOR: ${score}`;
      document.getElementById('btn-skill').style.opacity = player.mp >= 100 ? '1' : '0.35';
    }

    function startGame() {
      player.hp = 100;
      player.mp = 50;
      player.x = cw / 2;
      player.y = groundY;
      score = 0;
      wave = 1;
      enemies = [];
      particles = [];
      spawnWave();
      updateHUD();
      document.getElementById('overlay').style.display = 'none';
      gameRunning = true;
    }

    function gameOver() {
      gameRunning = false;
      document.getElementById('title-msg').innerText = "KAMU GUGUR! 💀";
      document.getElementById('sub-msg').innerHTML = `Kamu bertahan sampai <b>WAVE ${wave}</b><br>Total Skor: <b>${score}</b>`;
      document.querySelector('.start-btn').innerText = "MAIN LAGI";
      document.getElementById('overlay').style.display = 'flex';
    }

    // Loop Utama Game
    function update() {
      ctx.clearRect(0, 0, cw, ch);

      // Gambar Lantai Pertempuran
      ctx.fillStyle = '#11161d';
      ctx.fillRect(0, groundY, cw, ch - groundY);
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(cw, groundY);
      ctx.stroke();

      if (gameRunning) {
        // Pergerakan Pemain
        if (keys.left) { player.vx = -player.speed; player.dir = -1; player.walkCycle += 0.25; }
        else if (keys.right) { player.vx = player.speed; player.dir = 1; player.walkCycle += 0.25; }
        else { player.vx = 0; player.walkCycle = 0; }

        player.x += player.vx;
        player.x = Math.max(20, Math.min(cw - 20, player.x));

        // Gravitasi Lompat
        player.vy += 0.65;
        player.y += player.vy;
        if (player.y >= groundY) {
          player.y = groundY;
          player.vy = 0;
          player.isGrounded = true;
        }

        if (player.atkTimer > 0) player.atkTimer--;

        // Munculkan Musuh Bertahap
        if (enemiesToSpawn > 0) {
          spawnTimer++;
          if (spawnTimer > 55) {
            spawnEnemy();
            enemiesToSpawn--;
            spawnTimer = 0;
          }
        } else if (enemies.length === 0) {
          wave++;
          player.hp = Math.min(player.maxHp, player.hp + 25); // Bonus darah tiap ganti wave
          spawnWave();
          updateHUD();
        }

        // Update Musuh
        for (let i = enemies.length - 1; i >= 0; i--) {
          const en = enemies[i];
          const dist = player.x - en.x;
          const dir = dist > 0 ? 1 : -1;

          if (Math.abs(dist) > 35) {
            en.x += dir * en.speed;
            en.walk += 0.2;
            en.isAttacking = false;
          } else {
            // Musuh Menyerang Pemain
            if (en.atkCooldown <= 0) {
              en.isAttacking = true;
              if (Math.abs(player.y - en.y) < 45) {
                player.hp -= en.isBoss ? 18 : 8;
                createParticles(player.x, player.y - 30, '#ffaa00', 6);
                playSound('hit');
                updateHUD();
                if (player.hp <= 0) gameOver();
              }
              en.atkCooldown = 45;
            } else {
              en.isAttacking = false;
            }
          }
          if (en.atkCooldown > 0) en.atkCooldown--;

          // Gambar Bar Darah Musuh
          ctx.fillStyle = '#444';
          ctx.fillRect(en.x - 18, en.y - 75 * en.scale, 36, 5);
          ctx.fillStyle = '#ff2222';
          ctx.fillRect(en.x - 18, en.y - 75 * en.scale, (en.hp / en.maxHp) * 36, 5);

          drawStickman(en.x, en.y, en.scale, en.color, dir, en.walk, en.isAttacking, null);

          // Jika Musuh Mati
          if (en.hp <= 0) {
            createParticles(en.x, en.y - 30, en.color, 18);
            score += en.isBoss ? 50 : 10;
            player.mp = Math.min(player.maxMp, player.mp + 15);
            enemies.splice(i, 1);
            updateHUD();
          }
        }

        // Efek Sambaran Jurus Petir
        if (lightningTimer > 0) {
          lightningTimer--;
          ctx.fillStyle = 'rgba(0, 255, 255, 0.25)';
          ctx.fillRect(0, 0, cw, ch);
          ctx.strokeStyle = '#00ffff';
          ctx.lineWidth = 6;
          for (let k = -2; k <= 2; k++) {
            ctx.beginPath();
            ctx.moveTo(player.x + k * 70, 0);
            ctx.lineTo(player.x + k * 70 + (Math.random() - 0.5) * 40, groundY / 2);
            ctx.lineTo(player.x + k * 70, groundY);
            ctx.stroke();
          }
        }

        // Gambar Karakter Pemain
        drawStickman(player.x, player.y, 1, '#ffffff', player.dir, player.walkCycle, player.atkTimer > 6, '#00ffff');
      }

      // Gambar Partikel Percikan
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        if (p.life <= 0) particles.splice(i, 1);
      }

      requestAnimationFrame(update);
    }

    // Event Listener Tombol Layar Sentuh HP
    function bindTouch(id, startFn, endFn) {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); startFn(); });
      if (endFn) el.addEventListener('touchend', (e) => { e.preventDefault(); endFn(); });
      el.addEventListener('mousedown', startFn);
      if (endFn) el.addEventListener('mouseup', endFn);
    }

    bindTouch('btn-left', () => keys.left = true, () => keys.left = false);
    bindTouch('btn-right', () => keys.right = true, () => keys.right = false);
    bindTouch('btn-jump', jump);
    bindTouch('btn-atk', attack);
    bindTouch('btn-skill', useSkill);

    // Kontrol Keyboard (Jika dibuka di Laptop)
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if (e.key === 'ArrowUp' || e.key === 'w') jump();
      if (e.key === ' ' || e.key === 'j') attack();
      if (e.key === 'k') useSkill();
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    update();
  </script>
</body>
</html>
